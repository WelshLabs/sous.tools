packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@apollo/protobufjs": true
  "@google/genai": true
  "@nestjs/core": true
  "@newrelic/fn-inspect": true
  "@newrelic/native-metrics": true
  "@scarf/scarf": true
  "@swc/core": true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  "@welshlabs/automated-kanban-agent": true
minimumReleaseAgeExclude:
  - '@welshlabs/automated-kanban-agent@1.0.8'
overrides:
  react: "19.2.7"
  react-dom: "19.2.7"
  "@types/react": "19.0.8"
  "@types/react-dom": "19.0.3"
