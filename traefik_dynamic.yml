http:
  routers:


    dev-web:
      rule: "Host(`dev.sous.tools`)"
      entryPoints:
        - web
        - websecure
      service: dev-web-service
      tls:
        certResolver: letsencrypt

    dev-api:
      rule: "Host(`dev-api.sous.tools`)"
      entryPoints:
        - web
        - websecure
      service: dev-api-service
      tls:
        certResolver: letsencrypt

    dev-pos:
      rule: "Host(`dev-pos.sous.tools`)"
      entryPoints:
        - web
        - websecure
      service: dev-pos-service
      tls:
        certResolver: letsencrypt

    dev-setup:
      rule: "Host(`dev-setup.sous.tools`)"
      entryPoints:
        - web
        - websecure
      service: dev-setup-service
      tls:
        certResolver: letsencrypt

    storybook:
      rule: "Host(`storybook.sous.tools`)"
      entryPoints:
        - web
        - websecure
      service: storybook-service
      tls:
        certResolver: letsencrypt



  services:
    dev-web-service:
      loadBalancer:
        servers:
          - url: "http://cptr:3000"

    dev-api-service:
      loadBalancer:
        servers:
          - url: "http://cptr:3001"

    dev-pos-service:
      loadBalancer:
        servers:
          - url: "http://cptr:3003"

    dev-setup-service:
      loadBalancer:
        servers:
          - url: "http://cptr:3002"

    storybook-service:
      loadBalancer:
        servers:
          - url: "http://cptr:3004"


