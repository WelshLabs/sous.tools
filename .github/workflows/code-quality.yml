name: Code Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarCloud

      # 1. Install pnpm FIRST so the Node step can find it
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup turbo
        run: npm install -g turbo

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Prepare Reports Directory
        run: mkdir -p quality-reports

      # --- THE GAUNTLET (All steps use continue-on-error so the workflow doesn't stop) ---

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck > quality-reports/typecheck-report.txt 2>&1
        continue-on-error: true

      - name: Lint
        id: lint
        run: pnpm lint > quality-reports/lint-report.txt 2>&1
        continue-on-error: true

      - name: Knip (Dead Code)
        id: knip
        run: pnpm run knip > quality-reports/knip-report.txt 2>&1
        continue-on-error: true

      - name: Unit Tests & Coverage
        id: unit-test
        # Ensure your package.json test script is configured to output coverage
        run: pnpm test -- --coverage > quality-reports/unit-test-report.txt 2>&1
        continue-on-error: true

      - name: E2E Tests (Playwright)
        id: e2e-test
        run: pnpm exec playwright test > quality-reports/e2e-test-report.txt 2>&1
        continue-on-error: true

      # - name: Build Web App
      #   id: build
      #   run: pnpm build --filter=web
      #   continue-on-error: true

      # - name: Fetch Production Secrets from Infisical
      #   uses: infisical/secrets-action@v1.0.8
      #   with:
      #     client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
      #     client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      #     project-slug: "sous-tools-1cd-a"
      #     env-slug: "prod"
      #     export-env: true

      # # --- 2. Start it in the background and wait for it to boot ---
      # - name: Start Web App & Wait
      #   if: steps.build.outcome == 'success'
      #   env:
      #     INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      #     INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      #     INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      #     # 1. Force Next.js to bind to IPv4 so wait-on and Lighthouse can find it
      #     HOSTNAME: 127.0.0.1
      #     PORT: 3000
      #   run: |
      #     pnpm --filter=web run start &
      #     # 2. Use 'tcp:' instead of 'http:' to bypass Next.js middleware redirects
      #     npx wait-on -t 60000 tcp:127.0.0.1:3000
      #   continue-on-error: true

      # - name: Lighthouse CI
      #   id: lighthouse
      #   if: steps.build.outcome == 'success'
      #   uses: treosh/lighthouse-ci-action@v12
      #   with:
      #     # Use 127.0.0.1 instead of localhost to prevent IPv6 resolution bugs in GitHub runners
      #     urls: |
      #       http://127.0.0.1:3000
      #     uploadArtifacts: true
      #     temporaryPublicStorage: true
      #   continue-on-error: true

      # - name: SonarCloud Scan
      #   id: sonar
      #   uses: SonarSource/sonarcloud-github-action@master
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   continue-on-error: true

      # --- ARTIFACT UPLOAD ---
      # This runs `always()` to ensure reports are saved even if the code is a mess
      - name: Upload All Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-code-quality-reports
          if-no-files-found: ignore
          path: |
            quality-reports
            coverage
            playwright-report

      # --- THE QUALITY GATE ---
      # This checks the outcome of every single step above.
      # If any of them failed, it physically fails the GitHub Action right here.
      # Because this step fails, Action #3 (Deploy) will NOT trigger.
      - name: Quality Gate Evaluation
        if: always()
        run: |
          echo "Evaluating Gauntlet Results..."
          FAILURES=0

          if [ "${{ steps.typecheck.outcome }}" == "failure" ]; then echo "❌ Typecheck failed"; FAILURES=1; fi
          if [ "${{ steps.lint.outcome }}" == "failure" ]; then echo "❌ Lint failed"; FAILURES=1; fi
          if [ "${{ steps.knip.outcome }}" == "failure" ]; then echo "❌ Knip failed"; FAILURES=1; fi
          if [ "${{ steps.unit-test.outcome }}" == "failure" ]; then echo "❌ Unit tests failed"; FAILURES=1; fi
          if [ "${{ steps.e2e-test.outcome }}" == "failure" ]; then echo "❌ E2E tests failed"; FAILURES=1; fi
          if [ "${{ steps.lighthouse.outcome }}" == "failure" ]; then echo "❌ Lighthouse failed"; FAILURES=1; fi
          if [ "${{ steps.sonar.outcome }}" == "failure" ]; then echo "❌ SonarCloud failed"; FAILURES=1; fi

          if [ $FAILURES -ne 0 ]; then
            echo "🚨 ONE OR MORE QUALITY CHECKS FAILED!"
            echo "Download the 'aggregated-code-quality-reports' artifact to view your complete Battle Plan."
            exit 1
          else
            echo "✅ ALL CHECKS PASSED! Ready for deployment."
          fi

