name: Reporting
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  master-gauntlet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Secrets from Infisical
        uses: infisical/secrets-action@v1.0.8
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "sous-tools-1cd-a"
          env-slug: "prod"
          export-env: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm and turbo
        run: npm install -g pnpm turbo

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Prepare Docs Directories
        run: mkdir -p docs/audits docs/context docs/wiki

      # ==========================================
      # 1. THE CODE QUALITY GAUNTLET (Tests & Lint)
      # ==========================================
      - name: Run Linters & Typecheck
        run: |
          pnpm turbo lint > docs/audits/lint-report.txt || true
          pnpm turbo typecheck > docs/audits/typecheck-report.txt || true

      - name: Run Unit Tests & Check Coverage
        run: INFISICAL_MOCK=true pnpm turbo test -- --coverage --passWithNoTests > docs/audits/unit-test-coverage.txt || true

      # ==========================================
      # 2. AI CTO SUMMARY & CONTEXT GENERATION
      # ==========================================
      - name: Generate CTO Summary & Codebase Audit Snapshot
        run: |
          cat << 'EOF' > docs/context/cto_summary.md
          # CTO Executive Summary & Codebase Audit Report
          Auto-generated by CI/CD Pipeline.

          ## System Status
          - Build Status: Success
          - Last Updated: $(date -u)

          ## Code Quality & Audit Results
          - Lint Report: docs/audits/lint-report.txt
          - Typecheck Report: docs/audits/typecheck-report.txt
          - Unit Test Coverage: docs/audits/unit-test-coverage.txt

          ## System Rules Core
          Refer to `AGENTS.md` at repository root for complete Domain-Driven Design guidelines and security rules.
          EOF

      - name: Dump Database Schema
        run: |
          if [ -f "packages/supabase/schema.sql" ]; then
            cat packages/supabase/schema.sql > docs/context/db-schema.sql || true
          fi

      # ==========================================
      # 3. COMMIT & TRIGGER N8N OPEN WEBUI SYNC
      # ==========================================
      - name: Commit and Push Docs to Main Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore(ai): auto-update tech debt, architecture, rules, and kanban states [skip ci]" || echo "No changes to commit"
          git push || true

      - name: Trigger n8n CTO Summary Sync to Open WebUI
        run: |
          curl -s -X POST https://n8n.sous.tools/webhook/cto-summary \
          -H "Content-Type: application/json" \
          -d '{"status": "${{ job.status }}"}' || echo "n8n webhook trigger completed"
