---
name: Deploy Storybook

on:
  push:
    branches:
      - main # Or the branch you want to deploy from
    paths:
      - 'packages/design-system/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Use a Node.js version compatible with your project
          cache: 'pnpm' # Cache pnpm dependencies

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter "@soustools/design-system" build-storybook --output-dir storybook-static
        # If 'build-storybook' is not directly available, try 'npx sb build' or consult Storybook documentation for your version

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          # Automatically detect the base directory to deploy from.
          # If your Storybook build outputs to a different directory, update this.
          # Example: 'storybook-static'
          artifact-name: "storybook-static"
          token: "${{ secrets.GITHUB_TOKEN }}"
