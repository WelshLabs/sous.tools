name: Deploy Production API to Oracle Cloud Native

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm run lint
      - name: Run typecheck
        run: pnpm run typecheck
      # - name: Run knip
      #   run: pnpm run knip

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Infisical Secrets
        uses: infisical/secrets-action@v1.0.8
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "sous-tools-1cd-a"

      - name: Trigger Native Hardware Build via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ubuntu
          key: ${{ env.ORACLE_SSH_KEY }}
          script: |
            # 1. Navigate to your actual production codebase on the server
            cd /home/ubuntu/prod.sous.tools

            # 2. Pull the latest code you just pushed to GitHub
            git pull origin main

            # 3. Make sure the script is executable and run it!
            chmod +x deploy.sh
            ./deploy.sh
