name: Build and Release RPi OS Image

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/pi/**"
      - "deploy/ansible/**"
      - ".github/workflows/deploy-signage-os.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Who am I?
        run: whoami

      - name: Purge root-owned workspace files (Pre-checkout)
        run: |
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/work || true
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/deploy || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OS Image with pi-gen
        run: |
          cd deploy/pi/pi-gen

          # 1. Scaffold the mandatory config file that git ignores
          echo "IMG_NAME=soustools-signage" > config
          echo "TARGET_HOSTNAME=signage" >> config

          # Force 64-bit build for Raspberry Pi 5
          echo "TARGET_ARCH=arm64" >> config
          echo "ARCH=arm64" >> config

          # Enable SSH and continue (Removed FIRST_USER variables, we handle this manually now)
          echo "ENABLE_SSH=1" >> config
          echo "CONTINUE=1" >> config
          
          # 2. Restore the lost executable flags for EVERY internal script
          echo "Restoring lost +x permissions to all pi-gen scripts..."
          sudo find . -type f -name "*.sh" -exec chmod +x {} +
          sudo chmod +x stage*/prerun.sh || true

          # 3. THE FIX: Inject a chroot script to hard-bake the user & kill the setup wizards
          echo "Injecting enterprise kiosk user configurations..."
          cat << 'EOF' > stage2/01-sys-tweaks/99-kill-wizards-chroot.sh
          #!/bin/bash
          
          # A. Hard-bake the 'sous' user directly into the filesystem
          if ! id -u sous >/dev/null 2>&1; then
            useradd -m -s /bin/bash -G sudo,video,audio,plugdev,input,render,netdev,gpio,i2c,spi sous
            echo "sous:bootstrap123" | chpasswd
          fi
          
          # B. Mask the first-boot blue screen (userconfig) and the desktop setup wizard (piwiz)
          systemctl mask userconfig.service || true
          systemctl mask piwiz.service || true
          EOF
          
          sudo chmod +x stage2/01-sys-tweaks/99-kill-wizards-chroot.sh

          # 4. Execute the Dockerized build
          sudo ./build-docker.sh

      - name: Fetch Infisical Secrets
        uses: infisical/secrets-action@v1.0.8
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "sous-tools-1cd-a"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          repository: conarwelsh/signage-os
          token: ${{ env.SIGNAGE_GITHUB_PAT }}
          tag_name: v${{ github.run_number }}
          name: Signage OS v${{ github.run_number }}
          files: deploy/pi/pi-gen/deploy/*.zip
          make_latest: true

      - name: Cleanup Root-Owned Docker Files
        if: always()
        run: |
          echo "Wiping pi-gen directories to prevent root permission locks..."
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/work || true
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/deploy || true
