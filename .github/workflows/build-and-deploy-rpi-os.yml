name: Build and Release RPi OS Image

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/pi/**"
      - "deploy/ansible/**"
      - "apps/setup-portal/**"
      - ".github/workflows/build-and-deploy-rpi-os.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Who am I?
        run: whoami

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      # ── SECRETS: Must run BEFORE pi-gen so the deploy key can be injected ──
      - name: Fetch Infisical Secrets
        uses: infisical/secrets-action@v1.0.8
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "sous-tools-1cd-a"

      - name: Inject static deploy key into stage-sous/00-install/files/
        run: |
          # Write the Ed25519 read-only deploy key from Infisical.
          # 02-run-chroot.sh will install this to /home/sous/.ssh/id_ed25519
          # with chmod 600 inside the chroot. The file is scrubbed after build.
          printf '%s\n' "${{ env.SIGNAGE_DEPLOY_KEY_PRIVATE }}" \
            > deploy/pi/stage-sous/00-install/files/signage-deploy-key
          chmod 600 deploy/pi/stage-sous/00-install/files/signage-deploy-key

      - name: Stage stage-sous inside pi-gen (runtime injection)
        run: |
          # pi-gen expects custom stages to live alongside stage0–stage5.
          # We keep ours in deploy/pi/stage-sous/ and copy at CI time so
          # it never pollutes the upstream pi-gen checkout.
          cp -r deploy/pi/stage-sous deploy/pi/pi-gen/stage-sous

      - name: Inject stage SKIP flags for base layers (Caching)
        run: |
          cd deploy/pi/pi-gen
          if [ -d "work" ] && [ -d "work/stage2" ]; then
            echo "Cache found! Skipping base stages..."
            touch stage0/SKIP
            touch stage1/SKIP
            touch stage2/SKIP
          else
            echo "No cache found. Rebuilding base layers..."
            rm -f stage0/SKIP stage1/SKIP stage2/SKIP
          fi

      - name: Install native pi-gen dependencies
        run: sudo apt-get update && sudo apt-get install -y coreutils quilt parted debootstrap zerofree zip dosfstools libarchive-tools libcap2-bin grep rsync xz-utils curl bc gpg

      - name: Build OS Image natively with pi-gen
        env:
          PI_GEN_CONFIG: |
            IMG_NAME=soustools-signage
            TARGET_HOSTNAME=signage
            TARGET_ARCH=arm64
            ARCH=arm64
            ENABLE_SSH=1
            CONTINUE=1
            DEPLOY_COMPRESSION=none
            FIRST_USER_NAME=sous
            FIRST_USER_PASS=bootstrap123
            # Lean Lite image: skip desktop stages (3/4/5). stage-sous adds the kiosk stack.
            STAGE_LIST="stage0 stage1 stage2 stage-sous"
          CHROOT_SCRIPT: |
            #!/bin/bash
            # B. Mask interactive first-boot screens
            systemctl mask userconfig.service || true
            systemctl mask piwiz.service      || true
        run: |
          cd deploy/pi/pi-gen
          touch stage-sous/EXPORT_IMAGE

          # 1. Scaffold the mandatory config file that git ignores
          echo "$PI_GEN_CONFIG" > config

          # 2. Restore executable flags (git strips them on checkout)
          echo "Restoring +x permissions to all pi-gen scripts..."
          sudo find . -type f -name "*.sh" -exec chmod +x {} +
          sudo chmod +x stage*/prerun.sh             || true
          sudo chmod +x stage-sous/00-install/*.sh   || true
          sudo chmod +x stage-sous/00-install/files/*.sh || true

          # 3. Hard-bake the 'sous' user and kill first-boot wizards
          echo "$CHROOT_SCRIPT" > stage2/01-sys-tweaks/99-run-chroot.sh
          sudo chmod +x stage2/01-sys-tweaks/99-run-chroot.sh

          # 4. Run the NATIVE pi-gen build
          sudo ./build.sh

      - name: Scrub deploy key from workspace (security)
        if: always()
        run: |
          rm -f deploy/pi/stage-sous/00-install/files/signage-deploy-key           || true
          rm -f deploy/pi/pi-gen/stage-sous/00-install/files/signage-deploy-key    || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soustools-signage-os-image
          path: deploy/pi/pi-gen/deploy/*.img
          if-no-files-found: warn

      - name: Release image to GitHub (conarwelsh/signage-os)
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          repository: conarwelsh/signage-os
          token: ${{ env.SIGNAGE_GITHUB_PAT }}
          tag_name: v${{ github.run_number }}
          name: Signage OS v${{ github.run_number }}
          files: deploy/pi/pi-gen/deploy/*.img
          make_latest: true

      # THE ARMOR: Forcefully detach all system mounts BEFORE workspace cleanup
      - name: Cleanup and Protect Host Mounts
        if: always()
        run: |
          echo "Detaching any lingering pi-gen bind mounts..."
          sudo umount -l ${{ github.workspace }}/deploy/pi/pi-gen/work/*/stage*/rootfs/sys || true
          sudo umount -l ${{ github.workspace }}/deploy/pi/pi-gen/work/*/stage*/rootfs/proc || true
          sudo umount -l ${{ github.workspace }}/deploy/pi/pi-gen/work/*/stage*/rootfs/dev/pts || true
          sudo umount -l ${{ github.workspace }}/deploy/pi/pi-gen/work/*/stage*/rootfs/dev || true

          echo "Restoring +x permissions on pi-gen scripts for future runs..."
          sudo find ${{ github.workspace }}/deploy/pi/pi-gen -type f -name "*.sh" -exec chmod +x {} + || true

          echo "Wiping temporary staging directory..."
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/stage-sous || true

