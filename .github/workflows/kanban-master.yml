name: Kanban Two-Way Master Sync

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Handle Event and Sync
        env:
          # Personal Access Token needed to move cards on the Project Board
          PROJECT_PAT: ${{ secrets.KANBAN_PROJECT_PAT }}
          # Built-in token used to add labels (prevents infinite loop!)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          EVENT_NAME="${{ github.event_name }}"
          
          if [ "$EVENT_NAME" = "issues" ]; then
            # 1. Label was added manually -> Move Kanban Card & Trigger Agent
            LABEL="${{ github.event.label.name }}"
            ISSUE_URL="${{ github.event.issue.html_url }}"
            
            # Move Card
            if [[ "$LABEL" == "Ready" ]]; then STATUS="Ready";
            elif [[ "$LABEL" == "In Progress" || "$LABEL" == "agent:in-progress" ]]; then STATUS="In Progress";
            elif [[ "$LABEL" == "Review" ]]; then STATUS="Review";
            elif [[ "$LABEL" == "Done" ]]; then STATUS="Done";
            else exit 0; fi
            
            # Move Card on Kanban Board 2
            GH_TOKEN=$PROJECT_PAT gh project item-edit 2 --owner conarwelsh --url "$ISSUE_URL" --field "Status" --value "$STATUS" || true
            
            # Trigger Agent if Ready
            if [ "$LABEL" = "Ready" ]; then
              JSON_PAYLOAD=$(jq -n \
                '{action: "labeled", label: {name: "Ready"}, repository: {full_name: env.GITHUB_REPOSITORY}, issue: {number: env.ISSUE_NUMBER|tonumber, title: env.ISSUE_TITLE, body: env.ISSUE_BODY, state: "Ready"}}')
              curl -s -X POST https://n8n.sous.tools/webhook/kanban-agent \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
            fi

          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # 3. Human responded to Agent block -> Trigger Agent
            JSON_PAYLOAD=$(jq -n \
              '{action: "created", repository: {full_name: env.GITHUB_REPOSITORY}, issue: {number: env.ISSUE_NUMBER|tonumber}, comment: {body: env.COMMENT_BODY}}')
            curl -s -X POST https://n8n.sous.tools/webhook/kanban-agent \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD"
          fi
