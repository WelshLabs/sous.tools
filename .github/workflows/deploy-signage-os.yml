name: Build and Release Signage OS Image

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/pi/**"
      - "deploy/ansible/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Who am I?
        run: whoami

      - name: Purge root-owned workspace files (Pre-checkout)
        run: |
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/work || true
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/deploy || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OS Image with pi-gen
        run: |
          cd deploy/pi/pi-gen

          # 1. Scaffold the mandatory config file that git ignores
          echo "IMG_NAME=soustools-signage" > config
          echo "TARGET_HOSTNAME=signage" >> config

          # SSH & User Setup (The Bootstrap User for Ansible)
          echo "ENABLE_SSH=1" >> config
          echo "FIRST_USER_NAME=sous" >> config
          echo "FIRST_USER_PASS=bootstrap123" >> config
          echo "CONTINUE=1" >> config
          
          # 2. Recreate the directories we explicitly purged in the pre-checkout step
          # mkdir -p deploy work

          # 3. Execute the Dockerized build
          sudo chmod +x ./build-docker.sh
          sudo chmod +x ./build.sh
          sudo ./build-docker.sh

      - name: Fetch Infisical Secrets
        uses: infisical/secrets-action@v1.0.8
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "sous-tools-1cd-a"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          repository: conarwelsh/signage-os
          token: ${{ env.SIGNAGE_GITHUB_PAT }}
          tag_name: v${{ github.run_number }}
          name: Signage OS v${{ github.run_number }}
          files: deploy/pi/pi-gen/deploy/*.zip
          make_latest: true

      - name: Cleanup Root-Owned Docker Files
        if: always()
        run: |
          echo "Wiping pi-gen directories to prevent root permission locks..."
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/work || true
          sudo rm -rf ${{ github.workspace }}/deploy/pi/pi-gen/deploy || true
