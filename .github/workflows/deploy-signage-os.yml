name: Build and Release Signage OS Image

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/pi/**"
      - "deploy/ansible/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libguestfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools xz-utils linux-image-generic
          sudo chmod 0644 /boot/vmlinuz-*
          if [ -e /dev/kvm ]; then sudo chmod 0666 /dev/kvm; fi

      - name: Download Stock Raspberry Pi OS Lite
        run: |
          wget -qO pi-os.img.xz "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz"
          unxz pi-os.img.xz
          mv pi-os.img sous-signage-os.img

      - name: Inject Cloud-Init and Ansible Playbook
        run: |
          export LIBGUESTFS_BACKEND=direct
          # Use guestfish to inject files into the FAT32 boot partition (sda1)
          # We need LIBGUESTFS_BACKEND=direct if nested virtualization isn't supported, 
          # but GitHub Actions supports default backend usually.

          cat << 'EOF' > guestfish.script
          add sous-signage-os.img
          run
          mount /dev/sda1 /
          copy-in deploy/pi/cloud-init/user-data /
          mkdir /ansible
          # copy-in requires trailing slash for directories sometimes, or we can tar it first
          EOF

          # We tar the ansible directory to easily copy it in and extract it, or use copy-in
          # guestfish copy-in copies the directory itself if we specify the directory

          guestfish --rw -a sous-signage-os.img -m /dev/sda1 << 'EOF'
          copy-in deploy/pi/cloud-init/user-data /
          mkdir /ansible
          copy-in deploy/ansible /
          EOF

          # Note: guestfish copy-in deploy/ansible / will create /ansible directory with the contents?
          # Actually copy-in deploy/ansible / puts 'ansible' folder in /

      - name: Compress Custom OS Image
        run: |
          xz -T0 -9 sous-signage-os.img

      - name: Fetch Secrets from Infisical
        uses: infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "sous-tools-1cd-a"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          export-env: true

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          repository: conarwelsh/signage-os
          token: ${{ env.SIGNAGE_GITHUB_PAT }}
          tag_name: v${{ github.run_number }}
          name: Signage OS v${{ github.run_number }}
          files: sous-signage-os.img.xz
          make_latest: true
