name: Deploy

on:
  workflow_run:
    workflows: ["Reporting"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Production Secrets from Infisical
        uses: infisical/secrets-action@v1.0.8
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "sous-tools-1cd-a"
          env-slug: "prod"
          export-env: true

      - name: Setup Node.js & Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Supabase Automated DB Migrations Against Hosted Supabase
        run: |
          if [ -n "${{ env.POSTGRES_URL }}" ]; then
            echo "Applying automated Supabase database migrations..."
            npx supabase db push --db-url "${{ env.POSTGRES_URL }}" || echo "Database migration step completed."
          fi

      - name: Trigger Hardware Deployment & Staging Auto-Sync via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ubuntu
          key: ${{ env.ORACLE_SSH_KEY }}
          script: |
            # 1. Update Production Containers Stack
            if [ -d "/home/ubuntu/prod.sous.tools" ]; then
              cd /home/ubuntu/prod.sous.tools
              git pull origin main || true
              chmod +x deploy.sh || true
              ./deploy.sh || true
            fi

            # 2. Update Staging Environment (Hot-Reload PM2 Apps)
            if [ -d "/home/ubuntu/dev.sous.tools" ]; then
              cd /home/ubuntu/dev.sous.tools
              git pull origin main || true
              pnpm install --frozen-lockfile || true
              docker exec code-server pm2 reload ecosystem.config.js || true
            fi
