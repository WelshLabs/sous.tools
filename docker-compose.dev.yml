services:
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["home"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      # Strict memory limits to protect your 24GB Oracle instance
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    ports:
      - "7475:7474" # Neo4j Browser Web UI
      - "7688:7687" # Bolt protocol for NestJS
    volumes:
      - neo4j_dev_data:/data
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      # Route the traffic to your staging URL
      - "traefik.http.routers.neo4j-dev.rule=Host(`dev-graph.sous.tools`)"
      - "traefik.http.routers.neo4j-dev.entrypoints=websecure"
      - "traefik.http.routers.neo4j-dev.tls.certresolver=letsencrypt"
      # Tell Traefik to route to the internal container port (7474), not the host port!
      - "traefik.http.services.neo4j-dev.loadbalancer.server.port=7474"

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: /bin/sh
    profiles: ["home"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    command:
      - "-c"
      - |
        echo "Waiting for Ollama to boot..."
        sleep 10

        # Add any new models to this list separated by a space
        MODELS="qwen2.5-coder:7b deepseek-coder-v2 yi-coder:9b nomic-embed-text llama3.2-vision"

        for model in $$MODELS; do
          echo "Checking/Pulling $$model..."
          ollama pull $$model
        done

        echo "All models verified and ready!"

networks:
  traefik_public:
    external: true

volumes:
  redis_data:
  ollama_data:
  neo4j_dev_data:
