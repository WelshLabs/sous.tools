networks:
  traefik_public:
    external: true

services:
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traefik_public

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["home"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik_public

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: /bin/sh
    profiles: ["home"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: -c "sleep 10 && ollama pull qwen2.5-coder:3b && ollama pull nomic-embed-text && ollama pull llama3.2-vision && ollama pull qwen2.5-coder:7b && deepseek-coder:6.7b"
    depends_on:
      - ollama
    networks:
      - traefik_public

volumes:
  redis_data:
  ollama_data:
