services:
  redis:
    image: redis:alpine
    container_name: sous-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: sous-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  redis_data_dev:
  ollama_data:
