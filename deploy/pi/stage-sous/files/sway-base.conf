# =============================================================================
# sway-base.conf  —  Shared base included by BOTH sway-setup and sway-kiosk
# Enforces: no cursor, no keyboard shortcuts, gaps=0, black background.
# =============================================================================

# ── Disable the cursor ────────────────────────────────────────────────────────
seat * hide_cursor 1
seat * xcursor_theme default 1

# ── Input: block all keyboard bindings in kiosk context ──────────────────────
# The touchscreen/mouse can still be used by Chromium for touch UI.
input type:keyboard {
    xkb_options caps:none
}

# ── No window chrome ─────────────────────────────────────────────────────────
default_border none
default_floating_border none
hide_edge_borders both

# ── No gaps ──────────────────────────────────────────────────────────────────
gaps inner 0
gaps outer 0

# ── Solid black background on all outputs ────────────────────────────────────
output * bg #000000 solid_color

# ── Disable XWayland (not needed for Chromium Ozone) ────────────────────────
xwayland disable

# ── Focus follows mouse (no click-to-focus chrome) ───────────────────────────
focus_follows_mouse no

# ── Prevent screen blanking/DPMS during kiosk operation ──────────────────────
# DPMS is managed separately by operating_hours logic.
exec swayidle -w \
    timeout 0 '' \
    before-sleep ''
