# =============================================================================
# sway-setup.conf  —  PHASE 1: Mirror / Hardware Diagnostic Mode
#
# Both HDMI outputs display an identical copy of the setup-portal UI.
# This proves both screens are physically functional before any display
# assignment occurs. wl-mirror is used for the passive framebuffer copy.
#
# Active processes:
#   - 1× Chromium (setup portal on HDMI-A-1, workspace 1)
#   - 1× wl-mirror (captures HDMI-A-1 → renders fullscreen on HDMI-A-2)
# =============================================================================

include /etc/sway/sway-base.conf

# ── Outputs ───────────────────────────────────────────────────────────────────
# Both at 1920×1080. Resolution can be overridden per-device via ansible.
output HDMI-A-1 mode 1920x1080@60Hz position 0 0 bg #000000 solid_color
# output HDMI-A-2 mode 1920x1080@60Hz position 0 0 bg #000000 solid_color

# ── Workspaces ────────────────────────────────────────────────────────────────
# Workspace 1 is pinned to HDMI-A-1 only. HDMI-A-2 is driven by wl-mirror.
workspace 1 output HDMI-A-1

# ── Launch setup portal Chromium on HDMI-A-1 ─────────────────────────────────
exec chromium-browser \
    --kiosk \
    --noerrdialogs \
    --disable-infobars \
    --no-first-run \
    --disable-features=Translate \
    --enable-features=UseOzonePlatform \
    --ozone-platform=wayland \
    --user-data-dir=/tmp/chromium-setup \
    http://localhost:3100

# ── Mirror HDMI-A-1 → HDMI-A-2 using wl-mirror ───────────────────────────────
# wl-mirror opens a fullscreen window on the next unfocused output (HDMI-A-2)
# showing a live pixel-perfect copy of HDMI-A-1's framebuffer.
# This is a passive capture — zero overhead to the setup-portal render.
exec_always pkill -x wl-mirror || true
# exec wl-mirror HDMI-A-1
