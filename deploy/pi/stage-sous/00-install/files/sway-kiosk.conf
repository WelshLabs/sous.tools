# =============================================================================
# sway-kiosk.conf  —  PHASE 2: Split-Screen Production Kiosk
#
# Activated after POST /api/finalize confirms successful device pairing.
# Each HDMI output gets its own independent workspace and Chromium instance
# rendering a distinct route tied to its port_label in signage_displays.
#
# Active processes:
#   - 1× Chromium /display/screen-1 → HDMI-A-1 (workspace 1)
#   - 1× Chromium /display/screen-2 → HDMI-A-2 (workspace 2)
#   - wl-mirror: terminated by /api/finalize before this config loads
# =============================================================================

include /etc/sway/sway-base.conf

# ── Outputs ───────────────────────────────────────────────────────────────────
# Positioned side-by-side horizontally. Sway treats them as a virtual desktop.
output HDMI-A-1 mode 1920x1080@60Hz position    0 0 bg #000000 solid_color
output HDMI-A-2 mode 1920x1080@60Hz position 1920 0 bg #000000 solid_color

# ── Workspace-to-output pinning ───────────────────────────────────────────────
workspace 1 output HDMI-A-1
workspace 2 output HDMI-A-2

# ── Screen 1: HDMI-A-1  →  /display/screen-1  (port_label = HDMI-A-1) ────────
exec chromium-browser \
    --kiosk \
    --noerrdialogs \
    --disable-infobars \
    --no-first-run \
    --disable-features=Translate \
    --enable-features=UseOzonePlatform \
    --ozone-platform=wayland \
    --user-data-dir=/tmp/chromium-1 \
    --window-name="sous-screen-1" \
    http://localhost:3000/display/screen-1

# ── Screen 2: HDMI-A-2  →  /display/screen-2  (port_label = HDMI-A-2) ────────
# Separate --user-data-dir avoids Chromium singleton lock conflict.
exec chromium-browser \
    --kiosk \
    --noerrdialogs \
    --disable-infobars \
    --no-first-run \
    --disable-features=Translate \
    --enable-features=UseOzonePlatform \
    --ozone-platform=wayland \
    --user-data-dir=/tmp/chromium-2 \
    --window-name="sous-screen-2" \
    http://localhost:3000/display/screen-2

# ── Belt-and-suspenders: force workspaces after window creation ───────────────
# Chromium Ozone may not respect initial output assignments.
for_window [app_id="chromium" title="*screen-1*"] move to workspace 1
for_window [app_id="chromium" title="*screen-2*"] move to workspace 2
for_window [app_id="chromium"] fullscreen enable
