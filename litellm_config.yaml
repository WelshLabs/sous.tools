model_list:
  # =========================================================================
  # 1. HIGH-INTELLIGENCE PLANNING AGENTS
  # =========================================================================
  - model_name: planner
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: planner-pro
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # =========================================================================
  # 2. LOCAL OLLAMA DEVOPS & CODER EXECUTION AGENTS
  # =========================================================================
  - model_name: coder
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: ollama-coder
    litellm_params:
      model: openai/qwen2.5-coder:14b
      api_base: http://ollama:11434/v1
      drop_params: true

  # =========================================================================
  # 3. OMNIBAR AI COMMANDS MODEL
  # =========================================================================
  - model_name: omnibar
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # =========================================================================
  # 4. ACTUAL MODELS (Distinct aliases)
  # =========================================================================
  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: llama3.2-vision
    litellm_params:
      model: openai/llama3.2-vision
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: studio-3.7-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemma-4-31b
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemma-4-26b
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GEMINI_API_KEY

  - model_name: flash-latest
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY

  - model_name: flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: sk-1234
  drop_params: false
  force_timeout: 600
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

litellm_settings:
  turn_off_message_logging: true
  enable_cache_control: true

router_settings:
  num_retries: 2
  retry_after: 5
  fallbacks:
    - { "planner": ["studio-3.7-flash", "studio-3.6-flash", "coder"] }
    # planner pro is STRICTLY for user planning and is not to be used in any other part of the system
    - {
        "planner-pro":
          ["planner", "studio-3.7-flash", "studio-3.6-flash", "studio-3.5-flash-lite", "studio-3.1-flash-lite", "coder"],
      }
    - {
        "omnibar":
          [
            "studio-3.5-flash-lite",
            "studio-3.1-flash-lite",
            "ollama-coder",
          ],
      }
    - { "coder": ["studio-3.1-flash-lite", "ollama-coder"] }
