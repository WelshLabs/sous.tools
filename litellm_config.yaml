model_list:
  # =========================================================================
  # 1. HIGH-INTELLIGENCE PLANNING AGENTS (RESERVED FOR PLANNING & ADRs)
  # =========================================================================
  - model_name: planner
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true
      fallbacks: ["gemini-3.6-flash"]

  # =========================================================================
  # 2. BULLETPROOF FREE LOCAL OLLAMA DEVOPS & CODER EXECUTION AGENTS
  # Using Ollama's native OpenAI-compatible endpoint (http://ollama:11434/v1)
  # =========================================================================
  - model_name: light
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://ollama:11434/v1
      drop_params: true # qwen2.5-coder:7b does not support function_call schema
      fallbacks: ["gemini-3.6-flash"]

  - model_name: heavy
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true 
      fallbacks: ["claude-3-7-sonnet"]

  # =========================================================================
  # 3. DIRECT OLLAMA OPENAI-COMPATIBLE ENDPOINTS & BASE CLOUD MODELS
  # =========================================================================
  - model_name: coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://ollama:11434/v1
      drop_params: true
      fallbacks: ["gemini-3.6-flash"]

  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: llama3.2-vision
    litellm_params:
      model: openai/llama3.2-vision
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true

  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      drop_params: true

  - model_name: claude-3-7-sonnet
    litellm_params:
      model: anthropic/claude-3-7-sonnet-20250219
      api_key: os.environ/ANTHROPIC_API_KEY
      drop_params: true

general_settings:
  master_key: sk-1234
  drop_params: false
  force_timeout: 600
