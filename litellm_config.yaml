model_list:
  # =========================================================================
  # 1. HIGH-INTELLIGENCE PLANNING AGENTS
  # =========================================================================
  - model_name: planner
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: planner-pro
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # =========================================================================
  # 2. LOCAL OLLAMA DEVOPS & CODER EXECUTION AGENTS
  # =========================================================================
  - model_name: coder
    litellm_params:
      model: openai/qwen2.5-coder:14b
      api_base: http://ollama:11434/v1
      # drop_params: true (Left commented out to allow tool calls)


  # =========================================================================
  # 3. OMNIBAR AI COMMANDS MODEL
  # =========================================================================
  - model_name: omnibar
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # =========================================================================
  # 4. ACTUAL MODELS (Distinct aliases)
  # =========================================================================
  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: llama3.2-vision
    litellm_params:
      model: openai/llama3.2-vision
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: studio-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: studio-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: sk-1234
  drop_params: false
  force_timeout: 600
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

litellm_settings:
  turn_off_message_logging: true

router_settings:
  num_retries: 2
  retry_after: 5
  fallbacks:
    - {
        "planner":
          [
            "planner-pro",
            "coder",
            "studio-3.5-flash",
          ],
      }
    - {
        "planner-pro":
          [
            "planner",
            "coder",
          ],
      }
    - { "omnibar": ["studio-3.5-flash-lite", "coder"] }
    - { "coder": ["studio-3.5-flash-lite", "planner"] }
