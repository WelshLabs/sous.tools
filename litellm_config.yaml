model_list:
  # =========================================================================
  # 1. HIGH-INTELLIGENCE PLANNING AGENTS
  # =========================================================================
  - model_name: planner
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      fallbacks:
        ["gemini-3.5-flash", "gemma-4-31b", "gemini-3.5-flash-lite", "coder"]

  # =========================================================================
  # 2. LOCAL OLLAMA DEVOPS & CODER EXECUTION AGENTS
  # =========================================================================
  - model_name: light
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://ollama:11434/v1
      drop_params: true
      fallbacks:
        [
          "gemini-3.1-flash-lite",
          "gemini-3.5-flash-lite",
          "gemma-4-31b",
          "coder",
        ]

  - model_name: heavy
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      fallbacks:
        ["gemini-3.5-flash", "gemma-4-31b", "gemini-3.5-flash-lite", "coder"]

  # =========================================================================
  # 3. OMNIBAR AI COMMANDS MODEL
  # =========================================================================
  - model_name: omnibar
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      fallbacks: ["gemini-3.1-flash-lite", "gemma-4-31b", "coder"]

  # =========================================================================
  # 4. DIRECT ENDPOINTS & BASE MODELS
  # =========================================================================
  - model_name: coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://ollama:11434/v1
      drop_params: true
      fallbacks: ["gemma-4-31b", "gemini-3.5-flash-lite"]

  # =========================================================================
  # 4. ACTUAL MODELS
  # =========================================================================
  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: llama3.2-vision
    litellm_params:
      model: openai/llama3.2-vision
      api_base: http://ollama:11434/v1
      drop_params: true

  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemma-4-31b
    litellm_params:
      model: gemini/gemma-4-31b
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: sk-1234
  drop_params: false
  force_timeout: 600
