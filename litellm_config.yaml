model_list:
  # --- Route to your local Ollama container ---
  - model_name: qwen2.5-coder:7b
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama:11434
  - model_name: deepseek-coder-v2
    litellm_params:
      model: ollama/deepseek-coder-v2
      api_base: http://ollama:11434
  
  # --- Route to Google Gemini (2026 Models) ---
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # === THE CLAUDE CLI ALIASES ===
  # The Claude CLI hardcodes requests for these model names. 
  # This forces LiteLLM to serve Gemini 3.1 Pro instead whenever the CLI runs.
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: sk-1234