services:
  traefik:
    image: traefik:latest
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Ports deliberately not exposed to the outside world

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    environment:
      # - VISION_PROVIDER=ollama
      # - OLLAMA_HOST=http://ollama:11434
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.sous.tools`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  editor:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - DOCKER_MODS=linuxserver/mods:code-server-nodejs
    volumes:
      - ~/dev.sous.tools:/workspace
      - ~/.config/code-server:/config
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"

      # 1. The Code Server UI
      - "traefik.http.routers.editor.rule=Host(`editor.sous.tools`)"
      - "traefik.http.routers.editor.entrypoints=websecure"
      - "traefik.http.routers.editor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.editor.service=editor"
      - "traefik.http.services.editor.loadbalancer.server.port=8443"

      # 2. Dev Web App
      - "traefik.http.routers.dev-web.rule=Host(`dev.sous.tools`)"
      - "traefik.http.routers.dev-web.entrypoints=websecure"
      - "traefik.http.routers.dev-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-web.service=dev-web"
      - "traefik.http.services.dev-web.loadbalancer.server.port=3000"

      # 3. Dev API
      - "traefik.http.routers.dev-api.rule=Host(`dev-api.sous.tools`)"
      - "traefik.http.routers.dev-api.entrypoints=websecure"
      - "traefik.http.routers.dev-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-api.service=dev-api"
      - "traefik.http.services.dev-api.loadbalancer.server.port=6001"

      # 4. Dev POS Simulator
      - "traefik.http.routers.dev-pos.rule=Host(`dev-pos.sous.tools`)"
      - "traefik.http.routers.dev-pos.entrypoints=websecure"
      - "traefik.http.routers.dev-pos.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-pos.service=dev-pos"
      - "traefik.http.services.dev-pos.loadbalancer.server.port=3003"

      # 5. Dev Setup Portal
      - "traefik.http.routers.dev-setup.rule=Host(`dev-setup.sous.tools`)"
      - "traefik.http.routers.dev-setup.entrypoints=websecure"
      - "traefik.http.routers.dev-setup.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-setup.service=dev-setup"
      - "traefik.http.services.dev-setup.loadbalancer.server.port=3002"

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    # 1. Override the default Ollama binary entrypoint
    entrypoint: /bin/sh
    # 2. Pass the shell command directly without the YAML '>' block scalar
    command: -c "sleep 10 && ollama pull qwen2.5-coder:3b && ollama pull nomic-embed-text && ollama pull llama3.2-vision && ollama pull qwen2.5-coder:7b && deepseek-coder:6.7b"

volumes:
  letsencrypt:
  redis_data:
  ollama_data:

networks:
  traefik_public:
    external: true
