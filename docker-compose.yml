services:
  # =========================================================================
  # 1. EDGE PROXY TIER (PROD)
  # =========================================================================
  traefik:
    image: traefik:v3.6
    profiles: ["prod"]
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
    deploy:
      resources:
        limits:
          memory: 512m

  # =========================================================================
  # 2. DATA STORAGE TIER (PROD & DEV)
  # =========================================================================
  redis:
    image: redis:alpine
    profiles: ["dev", "prod"]
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traefik_public

  neo4j:
    image: neo4j:5-community
    profiles: ["dev", "prod"]
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["prod"]
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 3. LLM GATEWAY TIER (PROD)
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    profiles: ["prod"]
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 8g

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["prod"]
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama service to respond..."
        sleep 10
        MODELS="qwen2.5-coder:7b nomic-embed-text llama3.2-vision"
        for model in $$MODELS; do
          echo "Verifying/Pulling model $$model..."
          ollama pull $$model
        done
        echo "Ollama model synchronization complete!"
    networks:
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["prod"]
    container_name: litellm
    restart: unless-stopped
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    networks:
      - traefik_public
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 4. ORCHESTRATION & APP TIER (PROD)
  # =========================================================================
  n8n:
    image: n8nio/n8n:latest
    profiles: ["prod"]
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.sous.tools
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_COMMAND_ENABLE=true
      - WEBHOOK_URL=https://n8n.sous.tools/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_SVC_EXECUTION_FROM_COMMAND=false
      - N8N_SECURE_COOKIE=false
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/workflows:/etc/n8n/workflows
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-secure.rule=Host(`n8n.sous.tools`)"
      - "traefik.http.routers.n8n-secure.entrypoints=websecure"
      - "traefik.http.routers.n8n-secure.tls=true"
      - "traefik.http.routers.n8n-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n-service.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["prod"]
    container_name: api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-secure.rule=Host(`api.sous.tools`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.tls=true"
      - "traefik.http.routers.api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-service.loadbalancer.server.port=3001"
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 1g

  # =========================================================================
  # 5. DEV AGENT & IDE TIER (DEV)
  # =========================================================================
  cptr:
    build:
      context: .
      dockerfile: Dockerfile.cptr
    profiles: ["dev"]
    container_name: cptr
    user: "1001:1001"
    volumes:
      - cptr_home_data:/home/cptruser
      - cptr_data:/data
      - /home/conar/projects:/wsl_projects
      - /mnt/c/Users/conar/projects:/win_projects
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/conar/code/sous.tools:/sous.tools
      # readonly
      - /home/conar:/wsl_root:ro
      - /mnt/c/Users/conar:/win_root:ro
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: DEBUG
      OPENAI_API_BASE: "http://ORACLE_TAILSCALE_IP:4000/v1"
      OPENAI_API_KEY: sk-1234
      ENABLE_MCP: "true"
      SHELL: "/bin/zsh"
      DEFAULT_MODELS: "01-planner"
      ENV: /home/cptruser/.zshrc
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENV: ${INFISICAL_ENV}
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "8000:8000"

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    profiles: ["dev"]
    container_name: code-server
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - PROXY_DOMAIN=*
      - OPENAI_API_BASE=http://ORACLE_TAILSCALE_IP:4000/v1
      - OPENAI_API_KEY=sk-1234
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - /home/username/projects:/workspace/wsl_projects
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "8443:8443"

volumes:
  letsencrypt:
  redis_data:
  redis_dev_data:
  neo4j_data:
  neo4j_dev_data:
  qdrant_data:
  ollama_data:
  n8n_data:
  cptr_data:
  cptr_projects:
  cptr_home_data:

networks:
  traefik_public:
    name: traefik_public
    external: true
