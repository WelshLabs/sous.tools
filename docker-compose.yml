services:
  # =========================================================================
  # 1. EDGE PROXY TIER (PROD)
  # =========================================================================
  traefik:
    image: traefik:v3.6
    profiles: ["dev", "prod"]
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
      - VERCEL_API_TOKEN=${VERCEL_API_KEY}
      - VERCEL_TEAM_ID=team_NvBUmojEgCcSa4kGsKZtULd1
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=vercel"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
    deploy:
      resources:
        limits:
          memory: 512m

  # =========================================================================
  # 2. DATA STORAGE TIER (PROD & DEV)
  # =========================================================================
  redis:
    image: redis:alpine
    profiles: ["dev", "prod"]
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traefik_public

  neo4j:
    image: neo4j:5-community
    profiles: ["dev", "prod"]
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["dev", "prod"]
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant-secure.rule=Host(`qdrant.sous.tools`)"
      - "traefik.http.routers.qdrant-secure.entrypoints=web,websecure"
      - "traefik.http.routers.qdrant-secure.tls=true"
      - "traefik.http.routers.qdrant-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.qdrant-service.loadbalancer.server.port=6333"
    deploy:
      resources:
        limits:
          memory: 2g

  qdrant-sync:
    image: python:3.11-slim
    profiles: ["prod"]
    container_name: qdrant-sync
    depends_on:
      - qdrant
    volumes:
      - ./scripts/populate_qdrant.py:/app/populate_qdrant.py
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        pip install --no-cache-dir qdrant-client
        echo "Waiting for Qdrant database service to initialize..."
        sleep 5
        python3 /app/populate_qdrant.py
        echo "Qdrant initial synchronization complete!"
    networks:
      - traefik_public

  # =========================================================================
  # 3. LLM GATEWAY TIER (PROD ONLY — runs on Oracle Cloud)
  #    Dev environments connect to ai.sous.tools externally via Tailscale/DNS
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    profiles: ["prod"]
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 8g

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["prod"]
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama service to respond..."
        sleep 10
        MODELS="qwen2.5-coder:7b nomic-embed-text llama3.2-vision"
        for model in $$MODELS; do
          echo "Verifying/Pulling model $$model..."
          ollama pull $$model
        done
        echo "Ollama model synchronization complete!"
    networks:
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["prod"]
    container_name: litellm
    restart: unless-stopped
    command: [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        # "--detailed_debug"
      ]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      # - LITELLM_LOG=DEBUG
      - LITELLM_MASTER_KEY=sk-1234
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
    networks:
      - traefik_public
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm-secure.rule=Host(`ai.sous.tools`)"
      - "traefik.http.routers.litellm-secure.entrypoints=websecure"
      - "traefik.http.routers.litellm-secure.tls=true"
      - "traefik.http.routers.litellm-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm-service.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 4. ORCHESTRATION & APP TIER (PROD)
  # =========================================================================
  n8n:
    image: n8nio/n8n:latest
    profiles: ["prod"]
    container_name: n8n
    user: "root"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://n8n.sous.tools
      - N8N_WEBHOOK_URL=https://n8n.sous.tools
      - WEBHOOK_URL=https://n8n.sous.tools
      - N8N_COMMAND_ENABLE=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_TRUST_PROXY=true
      - N8N_PROXY_HOPS=1
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_SVC_EXECUTION_FROM_COMMAND=false
      - N8N_SECURE_COOKIE=false
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-secure.rule=Host(`n8n.sous.tools`)"
      - "traefik.http.routers.n8n-secure.entrypoints=websecure"
      - "traefik.http.routers.n8n-secure.tls=true"
      - "traefik.http.routers.n8n-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n-service.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          memory: 2g

  kanban-runner:
    build:
      context: .
      dockerfile: Dockerfile.cptr
    profiles: ["prod"]
    container_name: kanban-runner
    restart: unless-stopped
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
      - GIT_AUTHOR_NAME=n8n Bot
      - GIT_AUTHOR_EMAIL=n8n-bot@sous.tools
      - GIT_COMMITTER_NAME=n8n Bot
      - GIT_COMMITTER_EMAIL=n8n-bot@sous.tools
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=*
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        export INFISICAL_TOKEN=$$(infisical login --method=universal-auth --client-id=$${INFISICAL_CLIENT_ID} --client-secret=$${INFISICAL_CLIENT_SECRET} --silent --plain)
        exec infisical run --log-level info --projectId $${INFISICAL_PROJECT_ID} --env $${INFISICAL_ENV:-dev} -- sh -c 'sleep infinity'
    volumes:
      - .:/workspace
      - ${HOME}/.gemini:/home/cptruser/.gemini
      - ${HOME}/.config:/home/cptruser/.config
      - ${HOME}/.ssh:/home/cptruser/.ssh
      - ${HOME}/.gitconfig:/home/cptruser/.gitconfig
      # Shared pnpm store
      - ${HOME}/.local/share/pnpm:/home/cptruser/.local/share/pnpm
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["prod"]
    container_name: api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-secure.rule=Host(`api.sous.tools`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.tls=true"
      - "traefik.http.routers.api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-service.loadbalancer.server.port=3001"
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 1g

  # =========================================================================
  # 5. DEV AGENT & IDE TIER (DEV)
  # =========================================================================
  cptr:
    build:
      context: .
      dockerfile: Dockerfile.cptr
    profiles: ["dev"]
    container_name: cptr
    user: "1000:1000"
    volumes:
      - ./.cptr:/home/cptruser/.cptr
      - cptr_data:/data
      - /home/conar/.gemini:/home/cptruser/.gemini
      - /home/conar/.config:/home/cptruser/.config
      - /home/conar/.ssh:/home/cptruser/.ssh
      - /home/conar/.gitconfig:/home/cptruser/.gitconfig
      - /home/conar/projects:/wsl_projects
      - /mnt/c/Users/conar/projects:/win_projects
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/conar/code/sous.tools:/sous.tools
      # Shared pnpm store — all three envs (WSL/cptr/editor) use UID 1000, no permission conflicts
      - /home/conar/.local/share/pnpm:/home/cptruser/.local/share/pnpm
      # readonly
      - /home/conar:/wsl_root:ro
      - /mnt/c/Users/conar:/win_root:ro
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
      OPENAI_API_BASE: "https://ai.sous.tools/v1"
      OPENAI_API_KEY: sk-1234
      ENABLE_MCP: "true"
      SHELL: "/bin/zsh"
      DEFAULT_MODELS: "planner"
      ENV: /home/cptruser/.zshrc
      SOUS_TOOLS_ROOT: "/sous.tools"
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENV: ${INFISICAL_ENV}
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "4002:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cptr-secure.rule=Host(`cptr.sous.tools`)"
      - "traefik.http.routers.cptr-secure.entrypoints=websecure"
      - "traefik.http.routers.cptr-secure.priority=10"
      - "traefik.http.routers.cptr-secure.tls=true"
      - "traefik.http.routers.cptr-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.cptr-service.loadbalancer.server.port=8000"

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    profiles: ["dev"]
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - PROXY_DOMAIN=*
      - DEFAULT_WORKSPACE=/workspace
      - OPENAI_API_BASE=https://ai.sous.tools/v1
      - OPENAI_API_KEY=sk-1234
      - SOUS_TOOLS_ROOT=/workspace
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - /home/conar/code/sous.tools:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/conar/.gemini:/config/.gemini
      - /home/conar/.config:/config/.config
      - /home/conar/.ssh:/config/.ssh
      - /home/conar/.gitconfig:/config/.gitconfig
      # Shared pnpm store — same UID 1000 across all envs
      - /home/conar/.local/share/pnpm:/config/.local/share/pnpm
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "4001:8443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor-secure.rule=Host(`code.sous.tools`)"
      - "traefik.http.routers.editor-secure.entrypoints=websecure"
      - "traefik.http.routers.editor-secure.tls=true"
      - "traefik.http.routers.editor-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.editor-service.loadbalancer.server.port=8443"

  # =========================================================================
  # 6. LOCAL AI MEDIA TIER (DEV)
  # =========================================================================
  whisper-stt:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["dev"]
    container_name: whisper-stt
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - WHISPER_MODEL=base.en # Fast, highly accurate for English
    networks:
      - traefik_public

  openedai-tts:
    image: ghcr.io/matatonic/openedai-speech:latest
    profiles: ["dev"]
    container_name: openedai-tts
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    ports:
      - "8006:8000"
    volumes:
      - tts_voices:/app/voices
    networks:
      - traefik_public

  #comfyui:
  #  image: rocm/comfyui:latest
  #  profiles: ["dev"]
  #  container_name: comfyui
  # restart: unless-stopped
  # ports:
  #  - "8188:8188"
  # volumes:
  #  - sd_data:/app/ComfyUI/models
  #networks:
  #  - traefik_public
  # devices:
  #  - "/dev/kfd:/dev/kfd"
  #  - "/dev/dri:/dev/dri"
  #group_add:
  #  - video
  # ipc: host

volumes:
  letsencrypt:
  redis_data:
  redis_dev_data:
  neo4j_data:
  neo4j_dev_data:
  qdrant_data:
  ollama_data:
  n8n_data:
  cptr_data:
  cptr_projects:
  cptr_home_data:
  cptr_gemini_data:
  tts_voices:
  sd_data:

networks:
  traefik_public:
    name: traefik_public
    external: true
