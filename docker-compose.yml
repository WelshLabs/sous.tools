services:
  traefik:
    image: traefik:latest
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=DEBUG"
      - "--api.insecure=false"
      - "--providers.docker=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      # Strict memory limits to protect your 24GB Oracle instance
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt protocol for NestJS
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j.rule=Host(`graph.sous.tools`)"
      - "traefik.http.routers.neo4j.entrypoints=websecure"
      - "traefik.http.routers.neo4j.tls.certresolver=letsencrypt"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
      - "traefik.docker.network=traefik_public"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - redis
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:3001/health",
    #     ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 15s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    environment:
      # - VISION_PROVIDER=ollama
      # - OLLAMA_HOST=http://ollama:11434
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.sous.tools`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --detailed_debug
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_MASTER_KEY=sk-1234
    volumes:
      - /home/ubuntu/prod.sous.tools/litellm_config.yaml:/app/config.yaml
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`ai.sous.tools`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.sous.tools
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_COMMAND_ENABLE=true
      - WEBHOOK_URL=https://n8n.sous.tools
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      # Using the named volume you declared at the bottom of the file
      - n8n_data:/home/node/.n8n
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.sous.tools`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    container_name: code-server
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - OPENAI_API_BASE=https://ai.sous.tools
      - OPENAI_API_KEY=sk-1234 # Master key defined in litellm_config.yaml
      - DOCKER_MODS=linuxserver/mods:code-server-nodejs|linuxserver/mods:code-server-docker
      - DOCKER_GROUP=111
    volumes:
      - /home/ubuntu/dev.sous.tools:/workspace
      - /home/ubuntu/.config/code-server:/config
      - /home/ubuntu/.ssh:/config/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - default
      - traefik_public
      - supabase_network
    labels:
      - "traefik.enable=true"

      # 1. The Code Server UI
      - "traefik.http.routers.editor.rule=Host(`editor.sous.tools`)"
      - "traefik.http.routers.editor.entrypoints=websecure"
      - "traefik.http.routers.editor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.editor.service=editor"
      - "traefik.http.services.editor.loadbalancer.server.port=8443"

      # 2. Dev Web App
      - "traefik.http.routers.dev-web.rule=Host(`dev.sous.tools`)"
      - "traefik.http.routers.dev-web.entrypoints=websecure"
      - "traefik.http.routers.dev-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-web.service=dev-web"
      - "traefik.http.services.dev-web.loadbalancer.server.port=3000"

      # 3. Dev API
      - "traefik.http.routers.dev-api.rule=Host(`dev-api.sous.tools`)"
      - "traefik.http.routers.dev-api.entrypoints=websecure"
      - "traefik.http.routers.dev-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-api.service=dev-api"
      - "traefik.http.services.dev-api.loadbalancer.server.port=3001"

      # 4. Dev POS Simulator
      - "traefik.http.routers.dev-pos.rule=Host(`dev-pos.sous.tools`)"
      - "traefik.http.routers.dev-pos.entrypoints=websecure"
      - "traefik.http.routers.dev-pos.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-pos.service=dev-pos"
      - "traefik.http.services.dev-pos.loadbalancer.server.port=3003"

      # 5. Dev Setup Portal
      - "traefik.http.routers.dev-setup.rule=Host(`dev-setup.sous.tools`)"
      - "traefik.http.routers.dev-setup.entrypoints=websecure"
      - "traefik.http.routers.dev-setup.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dev-setup.service=dev-setup"
      - "traefik.http.services.dev-setup.loadbalancer.server.port=3002"

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama to boot..."
        sleep 10

        # Add any new models to this list separated by a space
        MODELS="qwen2.5-coder:7b deepseek-coder-v2 yi-coder:9b nomic-embed-text llama3.2-vision"

        for model in $$MODELS; do
          echo "Checking/Pulling $$model..."
          ollama pull $$model
        done

        echo "All models verified and ready!"

  agent-runner:
    build:
      context: . # Path to the folder containing your new Dockerfile
      dockerfile: Dockerfile.agentRunner
      args:
        - PUID=1001
        - PGID=1001
    container_name: agent-runner
    volumes:
      # Mount the exact same workspace as your code-server
      - /home/ubuntu/dev.sous.tools/:/workspace
      - agent_data:/home/agentuser
    environment:
      # Trick the Claude CLI into routing through LiteLLM
      - ANTHROPIC_BASE_URL=http://litellm:4000
      - ANTHROPIC_API_KEY=sk-1234 # Your LiteLLM Master Key
      - GITHUB_TOKEN=${GITHUB_TOKEN} # For the GitHub MCP Server
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
    networks:
      - traefik_public
    restart: unless-stopped

  supabase-studio-bridge:
    image: alpine/socat
    container_name: supabase-studio-bridge
    # Forwards Traefik traffic to the host machine's port 54323
    command: tcp-listen:54323,fork tcp:host.docker.internal:54323
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.rule=Host(`studio.sous.tools`)"
      - "traefik.http.routers.studio.entrypoints=websecure"
      - "traefik.http.routers.studio.tls.certresolver=letsencrypt"
      - "traefik.http.services.studio.loadbalancer.server.port=54323"
    networks:
      - traefik_public
    restart: unless-stopped

volumes:
  letsencrypt:
  redis_data:
  ollama_data:
  n8n_data:
  agent_data:
  neo4j_data:

networks:
  default:
  traefik_public:
    name: traefik_public
    external: true
  supabase_network:
    name: supabase_network_sous.tools
    external: true