version: "3.8"

services:
  traefik:
    image: traefik:latest
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=DEBUG"
      - "--api.insecure=false"
      - "--providers.docker=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j.rule=Host(`graph.sous.tools`)"
      - "traefik.http.routers.neo4j.entrypoints=websecure"
      - "traefik.http.routers.neo4j.tls.certresolver=letsencrypt"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
      - "traefik.docker.network=traefik_public"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - redis
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.sous.tools`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    restart: unless-stopped
    networks:
      - default
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    volumes:
      - /home/ubuntu/prod.sous.tools/litellm_config.yaml:/app/config.yaml
      - /home/ubuntu/dev.sous.tools:/workspace/dev.sous.tools
    networks:
      - traefik_public
    entrypoint: >
      sh -c "apk add --no-cache nodejs npm python3 && node /workspace/dev.sous.tools/packages/config/dist/cli.js python3 /app/main.py --config /app/config.yaml --detailed_debug"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`ai.sous.tools`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    user: root
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.sous.tools
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_COMMAND_ENABLE=true
      - WEBHOOK_URL=https://sous.tools
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_SVC_EXECUTION_FROM_COMMAND=false
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/ubuntu/dev.sous.tools/packages/workflows:/etc/n8n/workflows
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/dev.sous.tools:/home/ubuntu/dev.sous.tools
    command: >
      sh -c "apk add --no-cache docker-cli curl nodejs npm && node /home/ubuntu/dev.sous.tools/packages/config/dist/cli.js tini -- /docker-entrypoint.sh"
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.sous.tools`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    container_name: code-server
    group_add:
      - "111"
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - OPENAI_API_BASE=https://sous.tools
      - OPENAI_API_KEY=sk-1234
      - DOCKER_MODS=linuxserver/mods:code-server-nodejs|linuxserver/mods:code-server-docker
      - DOCKER_GROUP=111
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - /home/ubuntu/dev.sous.tools:/workspace
      - /home/ubuntu/.config/code-server:/config
      - /home/ubuntu/.ssh:/config/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor.rule=Host(`editor.sous.tools`)"
      - "traefik.http.routers.editor.entrypoints=websecure"
      - "traefik.http.routers.editor.tls.certresolver=letsencrypt"
      - "traefik.http.services.editor.loadbalancer.server.port=8443"
      - "traefik.http.routers.dev-web.rule=Host(`dev.sous.tools`)"
      - "traefik.http.routers.dev-web.entrypoints=websecure"
      - "traefik.http.routers.dev-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.dev-api.rule=Host(`dev-api.sous.tools`)"
      - "traefik.http.routers.dev-api.entrypoints=websecure"
      - "traefik.http.routers.dev-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.dev-pos.rule=Host(`dev-pos.sous.tools`)"
      - "traefik.http.routers.dev-pos.entrypoints=websecure"
      - "traefik.http.routers.dev-pos.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-pos.loadbalancer.server.port=3003"
      - "traefik.http.routers.dev-setup.rule=Host(`dev-setup.sous.tools`)"
      - "traefik.http.routers.dev-setup.entrypoints=websecure"
      - "traefik.http.routers.dev-setup.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-setup.loadbalancer.server.port=3002"

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama to boot..."
        sleep 10
        MODELS="qwen2.5-coder:7b deepseek-coder-v2 yi-coder:9b nomic-embed-text llama3.2-vision"
        for model in $$MODELS; do
          echo "Checking/Pulling $$model..."
          ollama pull $$model
        done
        echo "All models verified and ready!"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "6000:8080"
    networks:
      - traefik_public
    volumes:
      - open-webui_data:/app/backend/data
      - /home/ubuntu/dev.sous.tools:/workspace/dev.sous.tools
    environment:
      - OPENAI_API_BASE_URL=https://sous.tools
      - OPENAI_API_KEY=sk-1234
      - WEBUI_SECRET_KEY=password
      - WEBUI_AUTH=true
      - ENABLE_MCP=true
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    env_file:
      - ./mcp_servers.env
    entrypoint: >
      sh -c "apk add --no-cache nodejs npm && node /workspace/dev.sous.tools/packages/config/dist/cli.js /start.sh"
    restart: always
    depends_on:
      - litellm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`webui.sous.tools`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls.certresolver=letsencrypt"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_public"

volumes:
  letsencrypt:
  redis_data:
  ollama_data:
  n8n_data:
  neo4j_data:
  open-webui_data:

networks:
  default:
  traefik_public:
    name: traefik_public
    external: true
