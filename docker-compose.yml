vversion: "3.8"

services:
  # =========================================================================
  # 1. EDGE PROXY & INFRASTRUCTURE TIER
  # =========================================================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-socket-proxy
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - SWARM=0
      - TASKS=0
      - VOLUMES=1
      - INFO=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - traefik_public

  traefik:
    image: traefik:v3.1.7
    container_name: traefik
    depends_on:
      - docker-socket-proxy
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "letsencrypt:/letsencrypt"

    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 512m

  # =========================================================================
  # 2. DATA STORAGE & QUEUE TIER
  # =========================================================================
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 512m

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j.rule=Host(`graph.sous.tools`) || Host(`graph.localhost`)"
      - "traefik.http.routers.neo4j.entrypoints=websecure"
      - "traefik.http.routers.neo4j.tls=true"
      - "traefik.http.routers.neo4j.tls.certresolver=letsencrypt"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
      - "traefik.docker.network=traefik_public"
    deploy:
      resources:
        limits:
          memory: 3g

  # =========================================================================
  # 3. LLM GATEWAY & LOCAL MODEL TIER
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 8g

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama service to respond..."
        sleep 10
        MODELS="qwen2.5-coder:7b deepseek-coder-v2 yi-coder:9b nomic-embed-text llama3.2-vision"
        for model in $$MODELS; do
          echo "Verifying/Pulling model $$model..."
          ollama pull $$model
        done
        echo "Ollama model synchronization complete!"
    networks:
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    networks:
      - traefik_public
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`ai.sous.tools`) || Host(`ai.localhost`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.routers.litellm.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
      - "traefik.docker.network=traefik_public"
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 4. AGENTIC ORCHESTRATION & IDE TIER
  # =========================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    user: root
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.sous.tools
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_COMMAND_ENABLE=true
      - WEBHOOK_URL=https://n8n.sous.tools/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_SVC_EXECUTION_FROM_COMMAND=false
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/workflows:/etc/n8n/workflows
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.sous.tools`) || Host(`n8n.localhost`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=traefik_public"
    deploy:
      resources:
        limits:
          memory: 2g

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - OPENAI_API_BASE=https://ai.sous.tools/v1
      - OPENAI_API_KEY=sk-1234
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor.rule=Host(`editor.sous.tools`) || Host(`editor.localhost`)"
      - "traefik.http.routers.editor.entrypoints=websecure"
      - "traefik.http.routers.editor.tls=true"
      - "traefik.http.routers.editor.tls.certresolver=letsencrypt"
      - "traefik.http.services.editor.loadbalancer.server.port=8443"
      # Staging Preview Domain Routes exposed by code-server PM2
      - "traefik.http.routers.dev-web.rule=Host(`dev.sous.tools`) || Host(`dev.localhost`)"
      - "traefik.http.routers.dev-web.entrypoints=websecure"
      - "traefik.http.routers.dev-web.tls=true"
      - "traefik.http.routers.dev-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.dev-api.rule=Host(`dev-api.sous.tools`) || Host(`dev-api.localhost`)"
      - "traefik.http.routers.dev-api.entrypoints=websecure"
      - "traefik.http.routers.dev-api.tls=true"
      - "traefik.http.routers.dev-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.dev-pos.rule=Host(`dev-pos.sous.tools`) || Host(`dev-pos.localhost`)"
      - "traefik.http.routers.dev-pos.entrypoints=websecure"
      - "traefik.http.routers.dev-pos.tls=true"
      - "traefik.http.routers.dev-pos.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-pos.loadbalancer.server.port=3003"
      - "traefik.http.routers.dev-setup.rule=Host(`dev-setup.sous.tools`) || Host(`dev-setup.localhost`)"
      - "traefik.http.routers.dev-setup.entrypoints=websecure"
      - "traefik.http.routers.dev-setup.tls=true"
      - "traefik.http.routers.dev-setup.tls.certresolver=letsencrypt"
      - "traefik.http.services.dev-setup.loadbalancer.server.port=3002"
      - "traefik.docker.network=traefik_public"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - traefik_public
    volumes:
      - open-webui_data:/app/backend/data
      - .:/workspace
      - ./packages/config/sanitizer.py:/app/backend/data/functions/sanitizer.py
    environment:
      - OPENAI_API_BASE_URL=https://ai.sous.tools/v1
      - OPENAI_API_KEY=sk-1234
      - WEBUI_SECRET_KEY=password
      - WEBUI_AUTH=true
      - ENABLE_MCP=true
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    env_file:
      - ./mcp_servers.env
    depends_on:
      - litellm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`webui.sous.tools`) || Host(`webui.localhost`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.tls.certresolver=letsencrypt"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_public"
    deploy:
      resources:
        limits:
          memory: 3g

  # =========================================================================
  # 5. PRODUCTION APPLICATION STACK TIER
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.sous.tools`) || Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      - "traefik.docker.network=traefik_public"
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  letsencrypt:
  redis_data:
  ollama_data:
  n8n_data:
  neo4j_data:
  open-webui_data:

networks:
  traefik_public:
    name: traefik_public
    external: true
