# =========================================================================
# SHARED CONFIGURATIONS (YAML ANCHORS)
# =========================================================================
x-mcp-config: &mcp-shared-env
  MCP_SERVERS: >-
    {
      "docker": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-docker"]},
      "github": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-github"]},
      "qdrant_adr": {
        "command": "uvx",
        "args": ["mcp-server-qdrant"],
        "env": {
          "QDRANT_URL": "http://qdrant:6333",
          "COLLECTION_NAME": "adr_knowledgebase"
        }
      }
    }

services:
  # =========================================================================
  # 1. EDGE PROXY TIER
  # =========================================================================
  traefik:
    image: traefik:v3.6
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Built-in global redirect (automatically safely bypasses ACME challenges)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=conar@sous.tools"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      # (The manual http-catchall labels have been completely removed)
    deploy:
      resources:
        limits:
          memory: 512m

  # =========================================================================
  # 2. DATA STORAGE & QUEUE TIER
  # =========================================================================
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 512m

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sousToolsPassword
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j-secure.rule=Host(`graph.sous.tools`)"
      - "traefik.http.routers.neo4j-secure.entrypoints=websecure"
      - "traefik.http.routers.neo4j-secure.tls=true"
      - "traefik.http.routers.neo4j-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.neo4j-secure.service=neo4j-service"
      - "traefik.http.routers.neo4j.rule=Host(`graph.localhost`)"
      - "traefik.http.routers.neo4j.entrypoints=web"
      - "traefik.http.routers.neo4j.service=neo4j-service"
      - "traefik.http.services.neo4j-service.loadbalancer.server.port=7474"
    deploy:
      resources:
        limits:
          memory: 3g

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant-secure.rule=Host(`qdrant.sous.tools`)"
      - "traefik.http.routers.qdrant-secure.entrypoints=websecure"
      - "traefik.http.routers.qdrant-secure.tls=true"
      - "traefik.http.routers.qdrant-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qdrant-secure.service=qdrant-service"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.localhost`)"
      - "traefik.http.routers.qdrant.entrypoints=web"
      - "traefik.http.routers.qdrant.service=qdrant-service"
      - "traefik.http.services.qdrant-service.loadbalancer.server.port=6333"
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 3. LLM GATEWAY & LOCAL MODEL TIER
  # =========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 8g

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama service to respond..."
        sleep 10
        MODELS="qwen2.5-coder:7b nomic-embed-text llama3.2-vision"
        for model in $$MODELS; do
          echo "Verifying/Pulling model $$model..."
          ollama pull $$model
        done
        echo "Ollama model synchronization complete!"
    networks:
      - traefik_public

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    networks:
      - traefik_public
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm-secure.rule=Host(`ai.sous.tools`)"
      - "traefik.http.routers.litellm-secure.entrypoints=websecure"
      - "traefik.http.routers.litellm-secure.tls=true"
      - "traefik.http.routers.litellm-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.litellm-secure.service=litellm-service"
      - "traefik.http.routers.litellm.rule=Host(`ai.localhost`)"
      - "traefik.http.routers.litellm.entrypoints=web"
      - "traefik.http.routers.litellm.service=litellm-service"
      - "traefik.http.services.litellm-service.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 2g

  # =========================================================================
  # 4. AGENTIC ORCHESTRATION & IDE TIER
  # =========================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.sous.tools
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_COMMAND_ENABLE=true
      - WEBHOOK_URL=https://n8n.sous.tools/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BLOCK_SVC_EXECUTION_FROM_COMMAND=false
      - N8N_SECURE_COOKIE=false
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/workflows:/etc/n8n/workflows
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-secure.rule=Host(`n8n.sous.tools`)"
      - "traefik.http.routers.n8n-secure.entrypoints=websecure"
      - "traefik.http.routers.n8n-secure.tls=true"
      - "traefik.http.routers.n8n-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-secure.service=n8n-service"
      - "traefik.http.routers.n8n.rule=Host(`n8n.localhost`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.routers.n8n.service=n8n-service"
      - "traefik.http.services.n8n-service.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          memory: 2g

  editor:
    build:
      context: .
      dockerfile: Dockerfile.editor
    container_name: code-server
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=America/New_York
      - PASSWORD=sousToolsPassword
      - SUDO_PASSWORD=sousToolsPassword
      - PROXY_DOMAIN=*
      - OPENAI_API_BASE=https://ai.sous.tools/v1
      - OPENAI_API_KEY=sk-1234
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    volumes:
      - /home/ubuntu/dev.sous.tools:/config/workspace
      - /home/ubuntu/dev.sous.tools:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor-secure.rule=Host(`editor.sous.tools`)"
      - "traefik.http.routers.editor-secure.entrypoints=websecure"
      - "traefik.http.routers.editor-secure.tls=true"
      - "traefik.http.routers.editor-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.editor-secure.service=editor-service"
      - "traefik.http.services.editor-service.loadbalancer.server.port=8443"
      - "traefik.docker.network=traefik_public"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"

  cptr:
    build:
      context: .
      dockerfile: Dockerfile.cptr
    container_name: cptr
    user: "1001:1001"
    volumes:
      - cptr_home_data:/home/cptruser
      - cptr_data:/data
      - cptr_projects:/projects
      - /home/ubuntu/dev.sous.tools:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *mcp-shared-env
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: DEBUG
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: sk-1234
      ENABLE_MCP: "true"                  # Forces CPTR to load your *mcp-shared-env anchor
      SHELL: "/bin/zsh"                   # Enforces the Starship/Zsh terminal environment
      DEFAULT_MODELS: "01-planner"
      ENV: /home/cptruser/.zshrc
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cptr-secure.rule=Host(`cptr.sous.tools`)"
      - "traefik.http.routers.cptr-secure.entrypoints=websecure"
      - "traefik.http.routers.cptr-secure.tls=true"
      - "traefik.http.routers.cptr-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cptr-secure.service=cptr-service"
      - "traefik.http.routers.cptr-local.rule=Host(`cptr.localhost`)"
      - "traefik.http.routers.cptr-local.entrypoints=web"
      - "traefik.http.routers.cptr-local.service=cptr-service"
      - "traefik.http.services.cptr-service.loadbalancer.server.port=8000"

  # =========================================================================
  # 5. PRODUCTION APPLICATION TIER
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-secure.rule=Host(`api.sous.tools`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.tls=true"
      - "traefik.http.routers.api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-secure.service=api-service"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=3001"
    networks:
      - traefik_public
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  letsencrypt:
  redis_data:
  neo4j_data:
  qdrant_data:
  ollama_data:
  n8n_data:
  cptr_data:
  cptr_projects:
  cptr_home_data:

networks:
  traefik_public:
    name: traefik_public
    external: true
